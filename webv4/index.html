<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19RH - Comunidad Darkest Hour</title>
    <link href="./output.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="i18n.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col min-h-screen" x-data="i18n">

    <header class="fixed top-0 left-0 right-0 bg-black bg-opacity-80 backdrop-blur-sm z-50">
        <nav x-data="{ mobileMenuIsOpen: false }" x-on:click.away="mobileMenuIsOpen = false" class="flex items-center justify-between border-b border-outline px-6 py-4 dark:border-outline-dark" aria-label="penguin ui menu">
            <!-- Brand Logo -->
            <a href="#" class="text-2xl font-bold text-on-surface-strong dark:text-on-surface-dark-strong">
                <span>La Taberna Hispana</span>
            </a>
            <!-- Desktop Menu -->
            <ul class="hidden items-center gap-4 md:flex">
                <li><a href="#" class="font-bold text-primary underline-offset-2 hover:text-primary focus:outline-hidden focus:underline dark:text-primary-dark dark:hover:text-primary-dark" aria-current="page" x-text="t('home')"></a></li>
                <li><a href="#player-container" class="font-medium text-on-surface underline-offset-2 hover:text-primary focus:outline-hidden focus:underline dark:text-on-surface-dark dark:hover:text-primary-dark" x-text="t('scoreboard')"></a></li>
                <li><a href="#donations-container" class="font-medium text-on-surface underline-offset-2 hover:text-primary focus:outline-hidden focus:underline dark:text-on-surface-dark dark:hover:text-primary-dark" x-text="t('donations')"></a></li>
                <li><a href="#" class="font-medium text-on-surface underline-offset-2 hover:text-primary focus:outline-hidden focus:underline dark:text-on-surface-dark dark:hover:text-primary-dark" @click="lang = (lang === 'es' ? 'en' : 'es')" x-text="t('language_button')"></a></li>
            </ul>
            <!-- Mobile Menu Button -->
            <button x-on:click="mobileMenuIsOpen = !mobileMenuIsOpen" x-bind:aria-expanded="mobileMenuIsOpen" x-bind:class="mobileMenuIsOpen ? 'fixed top-6 right-6 z-20' : null" type="button" class="flex text-on-surface dark:text-on-surface-dark md:hidden" aria-label="mobile menu" aria-controls="mobileMenu">
                <svg x-cloak x-show="!mobileMenuIsOpen" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
                <svg x-cloak x-show="mobileMenuIsOpen" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
            <!-- Mobile Menu -->
            <ul x-cloak x-show="mobileMenuIsOpen" x-transition:enter="transition motion-reduce:transition-none ease-out duration-300" x-transition:enter-start="-translate-y-full" x-transition:enter-end="translate-y-0" x-transition:leave="transition motion-reduce:transition-none ease-out duration-300" x-transition:leave-start="translate-y-0" x-transition:leave-end="-translate-y-full" id="mobileMenu" class="fixed max-h-svh overflow-y-auto inset-x-0 top-0 z-10 flex flex-col divide-y divide-outline rounded-b-radius border-b border-outline bg-surface-alt px-6 pb-6 pt-20 dark:divide-outline-dark dark:border-outline-dark dark:bg-surface-dark-alt md:hidden">
                <li class="py-4"><a href="#" @click="mobileMenuIsOpen = false" class="w-full text-lg font-bold text-primary focus:underline dark:text-primary-dark" aria-current="page" x-text="t('home')"></a></li>
                <li class="py-4"><a href="#player-container" @click="mobileMenuIsOpen = false" class="w-full text-lg font-medium text-on-surface focus:underline dark:text-on-surface-dark" x-text="t('scoreboard')"></a></li>
                <li class="py-4"><a href="#donations-container" @click="mobileMenuIsOpen = false" class="w-full text-lg font-medium text-on-surface focus:underline dark:text-on-surface-dark" x-text="t('donations')"></a></li>
                <li class="py-4"><a href="#" class="w-full text-lg font-medium text-on-surface focus:underline dark:text-on-surface-dark" @click="lang = (lang === 'es' ? 'en' : 'es'); mobileMenuIsOpen = false" x-text="t('language_button')"></a></li>
            </ul>
        </nav>
    </header>

    <main class="flex-grow pt-16">
        <section class="relative h-screen"
            x-data="{
                images: [
                    '../webv3/1.avif',
                    '../webv3/6.avif',
                    '../webv3/4.avif',
                    '../webv3/2.avif',
                    '../webv3/5.avif',
                    '../webv3/7.avif',
                    '../webv3/3.avif'
                ],
                arrowsNavigation: true,
                dotsNavigation: true,
                transition: 'slide',
                loop: true,
                autoplay: true,
                autoplayDuration: 5000,
                autoplayProgressBar: true,
                currentIndex: 0,
                autoplayInterval: null,
                autoplayTimer: null,
                autoplayProgress: 0,
                init() { this.startAutoplayInterval('all'); },
                set(index, from) { if (index > -1 && index < this.images.length) { if (index > this.currentIndex) { this.currentIndex = index; if (!this.loop && this.currentIndex === this.images.length - 1) { this.resetAutoplayInterval('all'); } else { if (from === 'button') { this.resetAutoplayInterval('all', true); } else { this.resetAutoplayInterval('timer', true); } } } else if (index < this.currentIndex) { this.currentIndex = index; if (from === 'button') { this.resetAutoplayInterval('all', true); } else { this.resetAutoplayInterval('timer', true); } } } },
                next(from) { if (!this.loop && this.currentIndex === this.images.length - 1) { return; } this.set((this.currentIndex + 1) % this.images.length, from); },
                previous(from) { if (!this.loop && this.currentIndex === 0) { return; } this.set((this.currentIndex - 1 + this.images.length) % this.images.length, from); },
                startAutoplayInterval(mode) { if (this.autoplay && (mode === 'all' || mode === 'interval')) { this.autoplayInterval = setInterval(() => this.next(), this.autoplayDuration); } if (this.autoplay && this.autoplayProgressBar && (mode === 'all' || mode === 'timer')) { this.autoplayProgressBar = false; this.autoplayProgress = 0; this.autoplayProgressBar = true; this.autoplayTimer = setInterval(() => { this.autoplayProgress += 100 / (this.autoplayDuration / 100); }, 100); } },
                resetAutoplayInterval(mode, restart) { if (this.autoplay && (mode === 'all' || mode === 'interval')) { clearInterval(this.autoplayInterval); if (restart && mode === 'interval') { this.startAutoplayInterval('interval'); } } if (this.autoplay && this.autoplayProgressBar && (mode === 'all' || mode === 'timer')) { clearInterval(this.autoplayTimer); if (restart && mode === 'timer') { this.startAutoplayInterval('timer'); } else if (!restart) { this.autoplayProgressBar = false; this.autoplayProgress = 0; this.autoplayProgressBar = true; } } if (restart && mode === 'all') { this.startAutoplayInterval('all'); } },
            }">
            <!-- Image Slider Container -->
            <div class="absolute inset-0 overflow-hidden" tabindex="0" x-on:keyup.right="next('button')" x-on:keyup.left="previous('button')">
                <!-- Images -->
                <div class="w-full h-full" role="region" aria-roledescription="carousel" aria-label="Image Slider">
                    <template x-for="(image, index) in images" :key="index">
                        <img :src="image" :alt="'Image ' + (index + 1)"
                            class="absolute top-0 left-0 w-full h-full object-cover"
                            x-bind:class="{
                                'transition duration-300 ease-in-out will-change-auto': transition,
                                'z-1': currentIndex === index,
                                'hidden': !transition && currentIndex !== index,
                                'opacity-100': (transition === 'fade' || transition === 'blur-sm')  && currentIndex === index,
                                'opacity-0 invisible': transition === 'fade' && currentIndex !== index,
                                'blur-xl opacity-0': transition === 'blur-sm' && currentIndex !== index,
                                'translate-x-0': transition === 'slide' && currentIndex === index,
                                '-translate-x-full': transition === 'slide' && currentIndex < index,
                                'translate-x-full': transition === 'slide' && currentIndex > index
                            }"
                            role="group" aria-roledescription="slide" :aria-label="'Image slide ' + (index + 1) + ' of ' + images.length" :aria-hidden="currentIndex !== index" />
                    </template>
                </div>
                <!-- END Images -->

                <!-- Previous Button -->
                <button x-cloak x-show="arrowsNavigation && !(!loop && currentIndex === 0)" x-on:click="previous('button')" type="button" class="group absolute -start-1 top-1/2 z-20 flex -translate-y-1/2 items-center rounded-e-md bg-zinc-900/60 py-5 ps-3 pe-2 text-white backdrop-blur-xs transition duration-150 ease-out hover:start-0 hover:bg-zinc-900/90 active:bg-zinc-900/75" aria-label="Previous Image Slide">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="hi-mini hi-chevron-left inline-block h-5 w-5 rtl:rotate-180"><path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/></svg>
                    <span class="sr-only">Previous</span>
                </button>
                <!-- END Previous Button -->

                <!-- Next Button -->
                <button x-cloak x-show="arrowsNavigation && !(!loop && currentIndex === images.length - 1)" x-on:click="next('button')" type="button" class="group absolute -end-1 top-1/2 z-20 flex -translate-y-1/2 items-center rounded-s-md bg-zinc-900/60 py-5 ps-2 pe-3 text-white backdrop-blur-xs transition duration-150 ease-out hover:end-0 hover:bg-zinc-900/90 active:bg-zinc-900/75" aria-label="Next Image Slide">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="hi-mini hi-chevron-right inline-block h-5 w-5 rtl:rotate-180"><path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg>
                    <span class="sr-only">Next</span>
                </button>
                <!-- END Next Button -->

                <!-- Progress Bar -->
                <div x-cloak x-show="autoplayProgressBar" class="absolute inset-x-0 bottom-0 z-20 h-1 w-full overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" x-bind:aria-valuenow="Math.round(autoplayProgress)" x-bind:aria-valuetext="`${Math.round(autoplayProgress)}% progress to next image slide`">
                    <div class="h-full bg-teal-500 transition-all duration-100 ease-linear" :style="{ width: `${autoplayProgress}%` }"></div>
                </div>
                <!-- END Progress Bar -->
            </div>
            <!-- END Image Slider Container -->

            <!-- Dots Navigation -->
            <div x-cloak x-show="dotsNavigation" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex flex-wrap justify-center gap-3 py-4">
                <template x-for="(image, index) in images" :key="index">
                    <button x-on:click="set(index, 'button')" type="button" class="h-2.5 w-2.5 rounded-full" x-bind:class="{ 'bg-zinc-300': currentIndex === index, 'bg-zinc-700 hover:bg-zinc-600 ring-4 ring-zinc-800': currentIndex !== index }"></button>
                </template>
            </div>
            <!-- END Dots Navigation -->

            <!-- Content -->
            <div class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-black/50 text-white">
                <div class="p-2 text-center">
                    <h1 class="text-5xl font-bold" x-text="t('welcome_message')"></h1>
                    <p class="text-2xl mt-4" x-text="t('welcome_subtitle')"></p>
                    <a href="https://discord.gg/QdmFXbNQvq" target="_blank" class="mt-8 inline-block bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded" x-text="t('join_discord_button')">
                    </a>
                </div>
            </div>
            <!-- END Content -->
        </section>

        <section class="py-20">
            <div class="container mx-auto text-center">
                <h2 class="text-4xl font-bold" x-text="t('about_title')"></h2>
                <p class="mt-4 max-w-4xl mx-auto">
                    <span x-html="t('about_p_1')"></span>
                    <br> <span x-html="t('about_p_2')"></span>
                    <br> <span x-html="t('about_p_3')"></span>
                </p>
            </div>
        </section>

        <section class="py-20 bg-gray-800">
            <div class="container mx-auto text-center">
                <h2 class="text-4xl font-bold" x-text="t('join_title')"></h2>
                <div class="grid md:grid-cols-2 gap-8 mt-8">
                    <div class="bg-gray-700 p-8 rounded-lg">
                        <h3 class="text-2xl font-bold" x-text="t('join_server_title')"></h3>
                        <a href="https://www.gametracker.com/server_info/api.tinchomika.com:7757/" target="_blank">
                            <img src="https://cache.gametracker.com/server_info/api.tinchomika.com:7757/b_560_95_1.png" border="0" class="mt-4 mx-auto">
                        </a>
                    </div>
                    <div class="bg-gray-700 p-8 rounded-lg">
                        <h3 class="text-2xl font-bold" x-text="t('join_discord_title')"></h3>
                        <a href="https://discord.gg/QdmFXbNQvq" target="_blank">
                            <img src="https://discord.com/api/guilds/1229627241902768209/widget.png?style=banner2" alt="Discord Banner 2" class="mt-4 mx-auto">
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section id="player-container" class="py-20" x-data="players()">
            <div class="container mx-auto text-center">
                <h2 class="text-4xl font-bold" x-text="t('online_players_title')"></h2>
                <div x-show="loading" class="mt-8" x-text="t('loading')"></div>
                <div x-show="!loading && players.length === 0" class="mt-8">
                    <p x-text="t('no_players')"></p>
                </div>
                <div x-show="!loading && players.length > 0" class="mt-8">
                    <table class="w-full text-left">
                        <thead>
                            <tr>
                                <th class="p-2" x-text="t('player')"></th>
                                <th class="p-2" x-text="t('score')"></th>
                                <th class="p-2" x-text="t('team')"></th>
                                <th class="p-2" x-text="t('ping')"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="player in players" :key="player.jugador">
                                <tr>
                                    <td class="p-2" x-text="player.jugador"></td>
                                    <td class="p-2" x-text="player.score || 0"></td>
                                    <td class="p-2" x-text="player.equipo === 'Blue' ? 'Allies' : 'Axis'"></td>
                                    <td class="p-2" x-text="player.ping || 0"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="py-20 bg-gray-800" x-data="topPlayers()">
            <div class="container mx-auto text-center">
                <h2 class="text-4xl font-bold" x-text="t('top_players_title')"></h2>
                <p class="subtitle" x-text="t('top_players_subtitle')"></p>
                <div x-show="loading" class="mt-8" x-text="t('loading')"></div>
                <div x-show="!loading && players.length === 0" class="mt-8" x-text="t('no_players_found')"></div>
                <div x-show="!loading && players.length > 0" class="mt-8">
                    <table class="w-full text-left">
                        <thead>
                            <tr>
                                <th class="p-2" x-text="t('position')"></th>
                                <th class="p-2" x-text="t('player')"></th>
                                <th class="p-2" x-text="t('total_score')"></th>
                                <th class="p-2" x-text="t('games_played')"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(player, index) in players" :key="player.player_name">
                                <tr>
                                    <td class="p-2" x-text="'#' + (index + 1)"></td>
                                    <td class="p-2" x-text="player.player_name"></td>
                                    <td class="p-2" x-text="player.total_score"></td>
                                    <td class="p-2" x-text="player.games_played"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="py-20" x-data="recentGames()">
            <div class="container mx-auto text-center">
                <h2 class="text-4xl font-bold" x-text="t('recent_games_title')"></h2>
                <p class="subtitle" x-text="t('recent_games_subtitle')"></p>
                <div x-show="loading" class="mt-8" x-text="t('loading')"></div>
                <div x-show="!loading && games.length === 0" class="mt-8" x-text="t('no_games_found')"></div>
                <div x-show="!loading && games.length > 0" class="mt-8 grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <template x-for="game in games.slice(0, 6)" :key="game.date">
                        <div class="bg-gray-800 p-4 rounded-lg">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold" x-text="game.map"></span>
                                <span class="text-sm text-gray-400" x-text="new Date(game.date).toLocaleDateString()"></span>
                            </div>
                            <div>
                                <h4 class="text-xl font-bold text-blue-400 mb-2">Allies</h4>
                                <template x-for="player in getTeamPlayers(game, 'Allies')" :key="player.player_name">
                                    <div class="flex justify-between text-sm py-1 border-b border-gray-700">
                                        <span x-text="player.player_name"></span>
                                        <span class="font-bold" x-text="player.score"></span>
                                    </div>
                                </template>
                            </div>
                            <hr class="my-4 border-gray-700">
                            <div>
                                <h4 class="text-xl font-bold text-red-500 mb-2">Axis</h4>
                                <template x-for="player in getTeamPlayers(game, 'Axis')" :key="player.player_name">
                                    <div class="flex justify-between text-sm py-1 border-b border-gray-700">
                                        <span x-text="player.player_name"></span>
                                        <span class="font-bold" x-text="player.score"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <section id="donations-container" class="py-20 text-center">
            <div class="container mx-auto">
                <h2 class="text-4xl font-bold" x-text="t('donations_title')"></h2>
                <p class="mt-4" x-text="t('donations_subtitle')"></p>
                <div class="flex justify-center items-center space-x-4 mt-8">
                    <a href='https://cafecito.app/19regimientohispano' rel='noopener' target='_blank'>
                        <img srcset='https://cdn.cafecito.app/imgs/buttons/button_5.png 1x, https://cdn.cafecito.app/imgs/buttons/button_5_2x.png 2x, https://cdn.cafecito.app/imgs/buttons/button_5_3.75x.png 3.75x' src='https://cdn.cafecito.app/imgs/buttons/button_5.png' alt='Invitame un café en cafecito.app' class="h-16">
                    </a>
                    <div id="donate-button"></div>
                </div>
            </div>
        </section>

        <section class="py-20 bg-gray-800 text-center">
            <div class="container mx-auto">
                <h3 class="text-2xl font-bold" x-text="t('donors_title')"></h3>
                <p class="mt-4" x-html="t('donors_p')"></p>
            </div>
        </section>
    </main>

    <footer class="bg-black py-8 text-center text-white mt-auto">
        <div class="container mx-auto">
            <p x-html="t('footer_p')"></p>
            <div class="flex justify-center space-x-4 mt-4">
                <a href="https://discord.gg/QdmFXbNQvq" target="_blank" class="hover:text-blue-400"><i class="fab fa-discord"></i></a>
                <a href="https://x.com/tinchotin3" target="_blank" class="hover:text-blue-400"><i class="fab fa-twitter"></i></a>
                <a href="https://github.com/tinchomika/19RH_web" target="_blank" class="hover:text-blue-400"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8"></script>
    <script>
        PayPal.Donation.Button({
            env: 'production',
            hosted_button_id: 'PBRZDFXC65FFQ',
            image: {
                src: 'https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif',
                alt: 'Donate with PayPal button',
                title: 'PayPal - The safer, easier way to pay online!',
            }
        }).render('#donate-button');

        document.addEventListener('alpine:init', () => {
            Alpine.data('players', () => ({
                loading: true,
                players: [],
                init() {
                    fetch('https://api.tinchomika.com/dh/api/dh-info')
                        .then(response => response.json())
                        .then(data => {
                            this.players = data.sort((a, b) => {
                                if (a.equipo === b.equipo) {
                                    return b.score - a.score;
                                }
                                return a.equipo.localeCompare(b.equipo);
                            });
                            this.loading = false;
                        });
                }
            }));

            Alpine.data('topPlayers', () => ({
                loading: true,
                players: [],
                init() {
                    fetch('https://api.tinchomika.com/dh/scoreboard/top-players')
                        .then(response => response.json())
                        .then(data => {
                            this.players = data;
                            this.loading = false;
                        });
                }
            }));

            Alpine.data('recentGames', () => ({
                loading: true,
                games: [],
                init() {
                    fetch('https://api.tinchomika.com/dh/scoreboard/recent-games')
                        .then(response => response.json())
                        .then(data => {
                            this.games = data;
                            this.loading = false;
                        });
                },
                getTeamPlayers(game, team) {
                    if (!game || !game.players) return [];
                    return game.players
                        .filter(p => (team === 'Allies' ? p.team === 'Blue' : p.team === 'Red'))
                        .sort((a, b) => b.score - a.score);
                }
            }));
        });

    </script>
</body>
</html>
